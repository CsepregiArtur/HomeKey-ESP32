; PlatformIO project for HomeKey-ESP32 (ESP32 / 4 MB flash, ESP-IDF framework)
;
;   Build:    pio run
;   Upload:   pio run -t upload      (bootloader + partition table + otadata + littlefs web UI + app)
;   Monitor:  pio device monitor
;   Erase:    pio run -t erase
;
; Notes
; -----
; * The ESP-IDF component manager is used as-is, so `main/idf_component.yml`
;   (arduino-esp32, littlefs, espp/serialization, ...) is resolved and downloaded
;   into `managed_components/` on the first build.
; * `board_build.partitions` must stay in sync with `sdkconfig.defaults`
;   (CONFIG_PARTITION_TABLE_CUSTOM_FILENAME) - PlatformIO flashes the partition
;   table it generates from this file and also uses it to locate the app and the
;   `spiffs` (littlefs) partition.
; * ESP-IDF itself reads `sdkconfig.defaults` and `sdkconfig.defaults.esp32`.
; * The two `extra_scripts` below only adapt the project's own CI workflow to
;   PlatformIO (web UI bundle + flashing the littlefs image), see their docstrings.

[platformio]
src_dir = main

[env:esp32dev]
; espressif32 6.13.0 is the last platform that still pairs ESP-IDF 5.5.x with GCC 14.2
; (platform 7.x ships ESP-IDF 6.1, which no longer contains the `mqtt` and `json`
; components required by main/CMakeLists.txt).
platform = espressif32@6.13.0
board = esp32dev
framework = espidf

; ESP-IDF is taken from a local checkout instead of the registry package
; `platformio/framework-espidf`: the newest version there is 5.5.3, which lacks
; httpd_uri_t::ws_post_handshake_cb (used in main/WebServerManager.cpp, added in
; 5.5.4). v5.5.5 is the version upstream CI builds with.
; Run scripts/setup_local_idf_package.sh once (writes package.json into $IDF_PATH,
; i.e. ~/esp/esp-idf by default) and adjust the path below if yours differs.
platform_packages =
	platformio/framework-espidf @ symlink:///Users/artur/esp/esp-idf
	platformio/toolchain-xtensa-esp-elf @ symlink:///Users/artur/.espressif/tools/xtensa-esp-elf/esp-14.2.0_20260121/xtensa-esp-elf

board_build.partitions = with_ota.csv

; esp_insights and esp_rainmaker (dependencies of arduino-esp32) embed server
; certificates with ESP-IDF's target_add_binary_data(), i.e. through *generated*
; assembly sources. PlatformIO does not run that generator and then fails with
; "Source `.pio/build/esp32dev/<name>.crt.S' not found". Generating the very same
; files through PlatformIO's embed mechanism (same IDF cmake script, same symbols)
; fixes it.
board_build.embed_txtfiles =
	managed_components/espressif__esp_insights/server_certs/https_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt

extra_scripts =
	pre:scripts/pio_pre_idf.py
	post:scripts/pio_post_flash_fs.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize, time
upload_speed = 460800

; PlatformIO hands ESP-IDF's compile options to the compiler through a shell and
; cannot quote the function-like macro that main/CMakeLists.txt adds to the `fmt`
; target (-DFMT_THROW(x)=::fmt::assert_fail(__FILE__,__LINE__,"fmt error")); the
; unescaped parentheses abort the build.
; Dropping it is safe: without an explicit FMT_THROW, fmt falls back to its own
; no-exceptions definition, which calls fmt::assert_fail() as well (only the text
; of the abort message differs). Builds with idf.py keep the override.
build_unflags =
	-DFMT_THROW(x)=::fmt::assert_fail(__FILE__,__LINE__,"fmt error")
	-DFMT_THROW(x)

